<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân | Nexora Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #1a1412;
            --sidebar-bg: #241b18;
            --sidebar-active: #3d2a22;
            --ink: #fdfaf7;
            --accent: #e07b54;
            --teal: #5ba4a0;
            --muted: #a69288;
            --card: #2d221e;
            --border: #3d2d27;
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            min-height: 100vh;
        }

        aside {
            width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
        }

        .admin-brand {
            padding: 32px;
            font-size: 1.4rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--ink);
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
        }

        .nav-group {
            padding: 0 16px;
            margin-bottom: 32px;
        }

        .nav-label {
            padding: 0 16px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--muted);
            margin-bottom: 12px;
            display: block;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--muted);
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 12px;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover,
        .nav-item.active {
            background: var(--sidebar-active);
            color: var(--ink);
        }

        main {
            margin-left: var(--sidebar-width);
            flex: 1;
            padding: 40px;
            max-width: 1200px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 48px;
        }

        .welcome h1 {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .profile-container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 40px;
        }

        .profile-side {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px;
            text-align: center;
            height: fit-content;
        }

        .avatar-huge {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: var(--sidebar-bg);
            border: 4px solid var(--border);
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 700;
            color: var(--accent);
            position: relative;
        }

        .avatar-huge::after {
            content: '\f030';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 36px;
            height: 36px;
            background: var(--accent);
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            cursor: pointer;
            border: 3px solid var(--card);
        }

        .profile-side h2 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .profile-side p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        .stat-badges {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-badge {
            padding: 12px;
            background: var(--sidebar-bg);
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
        }

        .stat-badge span {
            color: var(--muted);
        }

        .stat-badge strong {
            color: var(--ink);
        }

        .profile-main {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 48px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        input {
            width: 100%;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            padding: 14px 16px;
            border-radius: 12px;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--ink);
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
    </style>
</head>

<body>
    <aside>
        <div class="admin-brand">
            <div class="brand-dot"></div>Nexora Portal
        </div>
        <div class="nav-group">
            <span class="nav-label">Chính</span>
            <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
        </div>
        <div class="nav-group">
            <span class="nav-label">Cá nhân</span>
            <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user-circle"></i> Hồ sơ của tôi</a>
            <a href="login.html" class="nav-item"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</a>
        </div>
    </aside>

    <main>
        <div class="top-bar">
            <div class="welcome">
                <h1>Hồ sơ cá nhân</h1>
                <p>Quản lý thông tin tài khoản và cấu hình bảo mật của bạn.</p>
            </div>
            <div style="display: flex; gap: 12px;">
                <button class="btn btn-outline">Hủy bỏ</button>
                <button class="btn btn-primary"><i class="fa-solid fa-save"></i> Cập nhật hồ sơ</button>
            </div>
        </div>

        <div class="profile-container">
            <div class="profile-side">
                <div class="avatar-huge">BN</div>
                <h2>Bảo Nguyễn</h2>
                <p>Super Administrator</p>

                <div class="stat-badges">
                    <div class="stat-badge">
                        <span>Ngày tham gia</span>
                        <strong>15/01/2026</strong>
                    </div>
                    <div class="stat-badge">
                        <span>Lần đăng nhập cuối</span>
                        <strong>Vừa xong</strong>
                    </div>
                    <div class="stat-badge">
                        <span>Dự án quản lý</span>
                        <strong>24</strong>
                    </div>
                </div>
            </div>

            <div class="profile-main">
                <div class="section-title"><i class="fa-solid fa-id-card"></i> Thông tin cơ bản</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Họ và tên</label>
                        <input type="text" value="Bảo Nguyễn">
                    </div>
                    <div class="form-group">
                        <label>Email công việc</label>
                        <input type="email" value="bao.nguyen@nexora.vn">
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="text" value="090 123 4567">
                    </div>
                    <div class="form-group">
                        <label>Vị trí / Chức vụ</label>
                        <input type="text" value="Super Administrator" readonly>
                    </div>
                </div>

                <div class="section-title" style="margin-top: 40px;"><i class="fa-solid fa-shield-halved"></i> Bảo mật
                    tài khoản</div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Mật khẩu hiện tại</label>
                        <input type="password" placeholder="••••••••">
                    </div>
                    <div></div>
                    <div class="form-group">
                        <label>Mật khẩu mới</label>
                        <input type="password" placeholder="Nhập mật khẩu mới">
                    </div>
                    <div class="form-group">
                        <label>Xác nhận mật khẩu</label>
                        <input type="password" placeholder="Nhập lại mật khẩu mới">
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>

</html>

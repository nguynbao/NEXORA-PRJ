<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập | Nexora Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #1a1412;
            --sidebar-bg: #241b18;
            --ink: #fdfaf7;
            --accent: #e07b54;
            --teal: #5ba4a0;
            --muted: #a69288;
            --card: #2d221e;
            --border: #3d2d27;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* ─── BACKGROUND GRAPHICS ─── */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(224, 123, 84, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(60px);
        }

        .glow-1 {
            top: -200px;
            right: -100px;
        }

        .glow-2 {
            bottom: -200px;
            left: -100px;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 32px;
            width: 100%;
            max-width: 440px;
            padding: 48px;
            position: relative;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.4);
            animation: slideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-dot {
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .brand h2 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .form-title {
            margin-bottom: 32px;
            text-align: center;
        }

        .form-title h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .form-title p {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1rem;
        }

        input {
            width: 100%;
            background: var(--sidebar-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px 14px 44px;
            color: var(--ink);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            background: #2a201d;
            box-shadow: 0 0 0 4px rgba(224, 123, 84, 0.1);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            font-size: 0.85rem;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            cursor: pointer;
        }

        .remember input {
            width: auto;
            margin: 0;
        }

        .forgot {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }

        .btn-login {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(224, 123, 84, 0.3);
            background: #f08b64;
        }

        .footer-note {
            margin-top: 32px;
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
        }

        .footer-note a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>

    <div class="login-card">
        <div class="brand">
            <h2><span class="brand-dot"></span>Nexora Portal</h2>
        </div>

        <div class="form-title">
            <h1>Chào mừng trở lại</h1>
            <p>Vui lòng đăng nhập để quản trị hệ thống.</p>
        </div>

        <form action="admin/dashboard.html">
            <div class="form-group">
                <label>Tài khoản / Email</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="admin@nexora.vn" required>
                </div>
            </div>

            <div class="form-group">
                <label>Mật khẩu</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="form-options">
                <label class="remember">
                    <input type="checkbox"> Duy trì đăng nhập
                </label>
                <a href="#" class="forgot">Quên mật khẩu?</a>
            </div>

            <button type="submit" class="btn-login">
                Đăng nhập ngay <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>

        <div class="footer-note">
            Bảo mật bởi Nexora Core &nbsp;·&nbsp; <a href="../home.html">Quay lại trang chủ</a>
        </div>
    </div>
</body>

</html>
